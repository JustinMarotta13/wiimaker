[workspace]
resolver = "2"
members = [
    "crates/wiimaker-core",
    "crates/wiimaker-host",
    "crates/wiimaker-assets",
    "crates/wiimaker-scene",
    "crates/wiimaker-cli",
    "crates/wiimaker-editor",
    "games/hello-orb",
]
default-members = ["games/hello-orb"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/justin/wiimaker"

[workspace.dependencies]
wiimaker-core = { path = "crates/wiimaker-core" }
wiimaker-host = { path = "crates/wiimaker-host" }
wiimaker-assets = { path = "crates/wiimaker-assets" }
wiimaker-scene = { path = "crates/wiimaker-scene" }
wiimaker-editor = { path = "crates/wiimaker-editor" }
glam = { version = "0.29", default-features = false, features = ["libm"] }
minifb = "0.27"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
egui = "0.29"
eframe = { version = "0.29", default-features = true, features = ["default_fonts"] }
egui_dock = "0.14"
